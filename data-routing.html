<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F-Rev F 浆体管道专家系统 - 完整数据路由可视化 (100%)</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0e17; color: #e0e0e0; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; overflow: hidden; }
#header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: linear-gradient(90deg, #0d1520, #162040); border-bottom: 1px solid #1a3060; display: flex; align-items: center; padding: 0 20px; z-index: 50; }
#header h1 { font-size: 16px; color: #7eb8ff; font-weight: 500; }
#header .subtitle { font-size: 12px; color: #556; margin-left: 16px; }
#header .badge { background: #10b981; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; margin-left: 10px; }
#canvas { width: 100vw; height: 100vh; padding-top: 50px; }
svg { display: block; }
.node { cursor: pointer; }
.node rect { rx: 6; ry: 6; stroke-width: 1.5; transition: all 0.25s ease; }
.node:hover rect { filter: brightness(1.4) drop-shadow(0 0 8px currentColor); stroke-width: 2.5; }
.node text { fill: #ddd; text-anchor: middle; pointer-events: none; font-size: 9.5px; }
.node .node-title { font-weight: 600; font-size: 10px; fill: #fff; }
.edge { fill: none; stroke-width: 1.2; opacity: 0.4; transition: all 0.25s ease; }
.edge-label { font-size: 7.5px; fill: #667; text-anchor: middle; pointer-events: none; transition: all 0.25s ease; }
.layer-band { opacity: 0.03; }
.layer-title { font-size: 11px; fill: #445; font-weight: 600; text-anchor: middle; letter-spacing: 1px; }
#legend { position: fixed; top: 60px; right: 12px; background: rgba(13,21,32,0.96); padding: 12px 14px; border-radius: 8px; border: 1px solid #1a3060; font-size: 10px; width: 190px; z-index: 40; max-height: calc(100vh - 120px); overflow-y: auto; }
#legend h3 { color: #7eb8ff; margin-bottom: 8px; font-size: 12px; font-weight: 500; }
#legend .item { display: flex; align-items: center; margin: 4px 0; }
#legend .dot { width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; flex-shrink: 0; }
#legend hr { border: none; border-top: 1px solid #1a3060; margin: 8px 0; }
#legend .hint { color: #556; font-size: 9px; line-height: 1.5; }
#tooltip { position: fixed; background: rgba(13,21,32,0.97); border: 1px solid #4a9eff; border-radius: 8px; padding: 10px 12px; font-size: 10px; max-width: 350px; pointer-events: none; display: none; z-index: 100; line-height: 1.5; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
#tooltip .title { color: #7eb8ff; font-weight: 600; font-size: 11px; margin-bottom: 5px; }
#tooltip .desc { color: #aab; }
.highlight { opacity: 1 !important; stroke-width: 2.5 !important; }
.highlight-edge { opacity: 0.9 !important; stroke-width: 2.5 !important; }
.dim { opacity: 0.06 !important; }
.dim-label { opacity: 0.04 !important; }
#controls { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; z-index: 40; background: rgba(13,21,32,0.9); padding: 6px 10px; border-radius: 8px; border: 1px solid #1a3060; flex-wrap: wrap; justify-content: center; max-width: 90%; }
#controls button { background: #111828; border: 1px solid #2a3050; color: #99a; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 10px; transition: all 0.2s; white-space: nowrap; }
#controls button:hover { background: #1a2848; border-color: #4a9eff; color: #cde; }
#controls button.active { background: #1a3568; border-color: #4a9eff; color: #fff; }
#info-panel { position: fixed; bottom: 60px; right: 12px; background: rgba(13,21,32,0.96); padding: 10px 12px; border-radius: 8px; border: 1px solid #1a3060; font-size: 10px; max-width: 320px; z-index: 40; display: none; line-height: 1.5; max-height: 350px; overflow-y: auto; }
#info-panel .ptitle { color: #7eb8ff; font-weight: 600; margin-bottom: 4px; }
#info-panel .close { position: absolute; top: 5px; right: 8px; cursor: pointer; color: #556; font-size: 13px; }
#info-panel .close:hover { color: #fff; }
#stats { position: fixed; top: 60px; left: 12px; background: rgba(13,21,32,0.96); padding: 10px 12px; border-radius: 8px; border: 1px solid #1a3060; font-size: 10px; z-index: 40; }
#stats .stat { margin: 3px 0; }
#stats .stat-value { color: #10b981; font-weight: 600; }
</style>
</head>
<body>
<div id="header">
  <h1>F-Rev F 浆体管道专家系统</h1>
  <span class="subtitle">完整数据路由可视化</span>
  <span class="badge">100% 覆盖</span>
</div>
<svg id="canvas"></svg>
<div id="stats">
  <div class="stat">节点: <span class="stat-value">78</span></div>
  <div class="stat">路径: <span class="stat-value">127</span></div>
  <div class="stat">文件: <span class="stat-value">84</span></div>
  <div class="stat">代码行: <span class="stat-value">66,268</span></div>
</div>
<div id="legend">
  <h3>数据层分类</h3>
  <div class="item"><div class="dot" style="background:#2ecc71"></div>1. 外部数据源</div>
  <div class="item"><div class="dot" style="background:#3498db"></div>2. 数据加载层</div>
  <div class="item"><div class="dot" style="background:#9b59b6"></div>3. 内存数据模型</div>
  <div class="item"><div class="dot" style="background:#e67e22"></div>4. 计算引擎</div>
  <div class="item"><div class="dot" style="background:#e74c3c"></div>5. 专家控制/检测</div>
  <div class="item"><div class="dot" style="background:#1abc9c"></div>6. 输出/持久化</div>
  <div class="item"><div class="dot" style="background:#f39c12"></div>7. 用户界面</div>
  <hr>
  <div class="hint">点击节点 - 高亮上下游路径<br>点击空白 - 重置视图<br>悬停节点 - 查看详情</div>
</div>
<div id="tooltip"></div>
<div id="controls">
  <button onclick="filterLayer('all',this)" class="active">全部</button>
  <button onclick="filterLayer('input',this)">数据输入</button>
  <button onclick="filterLayer('compute',this)">计算引擎</button>
  <button onclick="filterLayer('expert',this)">专家控制</button>
  <button onclick="filterLayer('output',this)">输出/界面</button>
  <button onclick="filterLayer('bc',this)">边界条件</button>
  <button onclick="filterLayer('ui',this)">用户界面</button>
</div>
<div id="info-panel">
  <span class="close" onclick="this.parentElement.style.display='none'">x</span>
  <div class="ptitle"></div>
  <div class="pcontent"></div>
</div>
<script>

const nodes=[
// 数据源层
{id:'mdb',x:30,y:80,w:120,h:45,title:'Access DB (.mdb)',lines:['Access DB','(.mdb)'],color:'#2ecc71',layer:'input',desc:'Microsoft Access数据库，20+张表：CENPUMPS,VALVES,INSTRUMENTS,SECTIONS,LOCATIONS,POINTS,SOLIDS,SLURRY,LIQUID等'},
{id:'opc_scada',x:30,y:155,w:120,h:45,title:'OPC/SCADA',lines:['OPC/SCADA','(PLC/DCS)'],color:'#2ecc71',layer:'input',desc:'OPC DA接口(sopcdaauto.dll)，连接Siemens/Matrikon OPC Server，读写寄存器实现仪表数据采集和控制指令下发'},
{id:'user_input',x:30,y:230,w:120,h:45,title:'用户输入',lines:['用户输入','(Init/Editor)'],color:'#2ecc71',layer:'input',desc:'Init界面设置DeltaTime/BaseConc/EntAir/LiquidTemp，15个设备编辑器修改泵/阀/控制器参数'},

// 数据加载层
{id:'load_db',x:180,y:80,w:130,h:45,title:'LoadFromDatabase',lines:['LoadFromDatabase','(ADO全量加载)'],color:'#3498db',layer:'input',desc:'15+个Load过程：LoadCenPumps/LoadPDPumps/LoadValves/LoadChokes/LoadControllers/LoadTanks/LoadInstruments/LoadPRDs/LoadSystems/LoadPipelines/LoadSections/LoadPoints/LoadSolids/LoadSlurry/LoadLiquid'},
{id:'read_instr',x:180,y:155,w:130,h:45,title:'ReadInstrData',lines:['ReadInstrData','(OPC周期读取)'],color:'#3498db',layer:'input',desc:'每周期从OPC寄存器读取仪表实时值：OPCRegs[]→instrument[].trendValue[FLD/CLD/DLT]，FLD=现场值,CLD=计算值,DLT=差值'},
{id:'assign_ds',x:180,y:230,w:130,h:45,title:'AssignDataSets',lines:['AssignDataSets','AssignSections'],color:'#3498db',layer:'input',desc:'AssignDataSets绑定ADO DataSource，AssignSections计算派生属性：eD=rf/Idiam,XSecArea=π/4·D²,B=Bconst·sonV/A,SonVel'},

// 内存数据模型层 - 设备
{id:'cenpump',x:340,y:60,w:130,h:50,title:'离心泵数组',lines:['cenpump[501..510]','10台离心泵'],color:'#9b59b6',layer:'compute',desc:'全局设备数组：Tag,SpeedSet,Speed,Delay,MaxRPM,CPChar,特性曲线a[0..3]/b[0..3]/e[0..3]/h[0..3],Qmax,numSeries,numStages,HR'},
{id:'pdpump',x:340,y:130,w:130,h:50,title:'隔膜泵数组',lines:['pdpump[301..306]','6台隔膜泵'],color:'#9b59b6',layer:'compute',desc:'PDPumpType：Tag,Bore,Stroke,Plex,VolEff,MaxSPM,SpeedMin,SpeedMax,Speed,Flow,Displacement计算'},
{id:'valve',x:340,y:200,w:130,h:50,title:'阀门数组',lines:['valve[801..854]','54个阀门'],color:'#9b59b6',layer:'compute',desc:'ValveType：Tag,OpenCv,VChar,StrokeOpen,StrokeClose,Position,Auto，Cv-开度特性查表'},
{id:'choke',x:340,y:270,w:130,h:45,title:'节流阀数组',lines:['choke[]','节流阀'],color:'#9b59b6',layer:'compute',desc:'ChokeType：IDThroat,CDfactor,Beta，kc=6378.35·(1-β⁴)/CD²/IDThroat⁴'},
{id:'controller',x:340,y:335,w:130,h:45,title:'PID控制器',lines:['controller[]','PID控制器'],color:'#9b59b6',layer:'compute',desc:'ControllerType：Tag,PB,Ti,Td,SetPoint,Action，离散PID：pos=V0+direction·(PB/100)·[(1+dT/Ti)·e0-e1+(Td/dT)·(e0-2e1+e2)]'},
{id:'instrument',x:340,y:400,w:130,h:45,title:'仪表数组',lines:['instrument[]','仪表'],color:'#9b59b6',layer:'compute',desc:'InstrumentType：Tag,OPCRegIndex,ScaleMin,ScaleMax,trendValue[FLD/CLD/DLT]，多仪表投票泄漏检测'},
{id:'tank',x:340,y:465,w:130,h:45,title:'储罐数组',lines:['tank[601..604]','4个储罐'],color:'#9b59b6',layer:'compute',desc:'TankType：Tag,Diameter,OLN,OFN,InitialLevel,Level,Qin,Qout，dLevel=dT·(Qin-Qout)/3600/(π/4·D²)'},
{id:'prd',x:340,y:530,w:130,h:45,title:'泄压阀数组',lines:['prd[]','泄压阀'],color:'#9b59b6',layer:'compute',desc:'PRDType：Tag,SetPressure,FullOpenPressure,Position，压力超限自动开启'},
{id:'surgetk',x:340,y:595,w:130,h:45,title:'调压罐数组',lines:['surgeTK[]','调压罐'],color:'#9b59b6',layer:'compute',desc:'SurgeTankType：TotalVolume,InitialGasPressure,Exponent，多变过程：GasPress=sP0·(sV0/GasVol)^exponent'},

// 内存数据模型层 - 管道
{id:'section',x:500,y:60,w:130,h:50,title:'管段数组',lines:['Section[SI,PI,i]','管段属性'],color:'#9b59b6',layer:'compute',desc:'PipeSectionData：Idiam,rf,deltaX,GFw,GFs,B,SonVel,XSecArea,eD,PointCount,USNodeID,DSNodeID,GTIndex'},
{id:'ipoint',x:500,y:130,w:130,h:50,title:'计算点数组',lines:['IPoint[SI,PI,i,j]','计算点'],color:'#9b59b6',layer:'compute',desc:'IPointType：km_post,elevation,LineP,HGL,QPnew,Conc,SG,SlackFlag，水力计算核心数据'},
{id:'locations',x:500,y:200,w:130,h:45,title:'站点位置',lines:['Locations[SI,PI,i]','站点位置'],color:'#9b59b6',layer:'compute',desc:'LocationType：km,elevation,usP,dsP，站场位置定义'},
{id:'pipeline',x:500,y:265,w:130,h:45,title:'管线元数据',lines:['Pipeline[SI,PI]','管线'],color:'#9b59b6',layer:'compute',desc:'PipelineType：NoSec,NoLoc，管线段数和位置数'},

// 内存数据模型层 - 流体
{id:'liquid',x:500,y:330,w:130,h:45,title:'液体物性',lines:['Properties_Liquid','液体'],color:'#9b59b6',layer:'compute',desc:'temperature,SG,viscosity,vapPress,bulkMod，温度相关物性计算'},
{id:'slurry',x:500,y:395,w:130,h:45,title:'浆体物性',lines:['Properties_Slurry','浆体'],color:'#9b59b6',layer:'compute',desc:'conc,SG,SolidsSG,visCoeff,visExpon,TauCoeff,TauExpon,Rigidity,YieldStress，SlurrySG=1/(conc/SolSG+(1-conc)/LiqSG)'},
{id:'solids',x:500,y:460,w:130,h:45,title:'固体物性',lines:['Properties_Solids','固体'],color:'#9b59b6',layer:'compute',desc:'SG,bulkModulus,equalMoist，固体颗粒物性参数'},

// 内存数据模型层 - 其他
{id:'init_vals',x:500,y:525,w:130,h:45,title:'初始化参数',lines:['InitValues[]','初始化'],color:'#9b59b6',layer:'compute',desc:'DeltaTime(0.01-2.0s),BaseConc(0-25%),EntAir(0-0.01),LiquidTemp，持久化到INITILZE表'},
{id:'convert',x:500,y:590,w:130,h:45,title:'单位换算',lines:['TConvert','6维×8信号'],color:'#9b59b6',layer:'compute',desc:'6个维度：Internal/FromDB/ToScreen/FromUser/FromReg/ToReg，8种信号：Pressure/Flow/Level/Power/Density/Speed/Strokes/Temperature'},

// 计算引擎层
{id:'simulator',x:660,y:60,w:130,h:50,title:'Simulator(MOC)',lines:['Simulator','MOC特征线法'],color:'#e67e22',layer:'compute',desc:'核心水力求解器，隐式特征线法：遍历所有管段计算点，CallBC设置边界条件，Hp计算HGL，QP计算流量，每dT秒执行'},
{id:'call_bc',x:660,y:130,w:130,h:50,title:'CallBC路由',lines:['CallBC','边界条件路由'],color:'#e67e22',layer:'compute',desc:'根据USNodeID/DSNodeID分发：0=普通段,110=李家沟PS1,220=李家沟PS2,230=RamuVS1,240=RamuPS2,310=翁福PS等11种站场'},
{id:'nr_solver',x:660,y:200,w:130,h:45,title:'NR求解器',lines:['NRTest/FPTest','Newton-Raphson'],color:'#e67e22',layer:'compute',desc:'NRTest:IMax=24,eps=1e-6,x_new=x-f/df；FPTest:割线法+二分法混合,maxi=100，用于泵并联/储罐HGL/管段流量求解'},
{id:'hydgrad',x:660,y:265,w:130,h:45,title:'水力梯度',lines:['HydGrad/ff','Darcy-Weisbach'],color:'#e67e22',layer:'compute',desc:'层流(Re<2500):f=64/Re；湍流:Colebrook显式近似。HydGrad=sign·gFac·Gconst·f·V²/D,V=353.68·Q/D²,Re=1000·SG·D·V/Rigidity'},
{id:'pump_calc',x:660,y:330,w:130,h:45,title:'泵特性计算',lines:['tdh/eff/NPSHr','泵特性'],color:'#e67e22',layer:'compute',desc:'离心泵4阶多项式：tdh=HR·numSeries·numStages·Σ(a[i]·x^i)·s²；隔膜泵：Displacement=(π/4)·VolEff·Plex·Bore²·Stroke·1e-6'},
{id:'valve_calc',x:660,y:395,w:130,h:45,title:'阀门特性',lines:['ValveKV/Position','阀门'],color:'#e67e22',layer:'compute',desc:'Cv-开度特性查表线性插值，kv=numSeries·13.69213/Cv²，ValvePosition斜坡+累积行程计数'},
{id:'slurry_calc',x:660,y:460,w:130,h:45,title:'浆体物性计算',lines:['SlurrySG/VR','浆体'],color:'#e67e22',layer:'compute',desc:'SlurrySG=1/(conc/SolSG+(1-conc)/LiqSG)，VR=(LiqSG/SolSG)·(conc/(1-conc))，CoeffRigidity=visCoeff·10^(visExpon·VR)'},
{id:'tank_calc',x:660,y:525,w:130,h:45,title:'储罐/调压罐',lines:['TankLevel','液位'],color:'#e67e22',layer:'compute',desc:'储罐：dLevel=dT·(Qin-Qout)/3600/(π/4·D²)，约束OLN≤Level≤OFN；调压罐多变过程：GasPress=sP0·(sV0/GasVol)^exponent'},
{id:'batch_track',x:660,y:590,w:130,h:45,title:'批次跟踪',lines:['BatchInterFace','批次'],color:'#e67e22',layer:'compute',desc:'BatchValues[1..10,1..3]：列1=浓度(wt%)，列2=体积(m³)，列3=位置(km)，累积流量积分更新位置，质量守恒混合'},

// 边界条件层
{id:'bc_ps1',x:820,y:60,w:120,h:45,title:'李家沟PS1',lines:['tbc_Lijiagou_PS1','NodeID=110'],color:'#e67e22',layer:'bc',desc:'3隔膜泵+2离心泵+5储罐，8种运行状态，NR迭代求流量分配'},
{id:'bc_ps2',x:820,y:125,w:120,h:45,title:'李家沟PS2',lines:['tbc_Lijiagou_PS2','NodeID=220'],color:'#e67e22',layer:'bc',desc:'6隔膜泵+4离心泵+4储罐，16种运行状态，复杂并联逻辑'},
{id:'bc_ramu_ps2',x:820,y:190,w:120,h:45,title:'Ramu PS2',lines:['ibc_RamuPS2','NodeID=240'],color:'#e67e22',layer:'bc',desc:'6泵+6泄压阀+32阀门，24种运行状态(conPumpSta 0-23)，由4条件组合：conPump/conP/conPRV/conbp'},
{id:'bc_ramu_vs1',x:820,y:255,w:120,h:45,title:'Ramu VS1',lines:['ibc_RamuVS1','NodeID=230'],color:'#e67e22',layer:'bc',desc:'阀站边界条件，4种流路组合'},
{id:'bc_wengfu',x:820,y:320,w:120,h:45,title:'翁福站场',lines:['tbc_Wengfu_*','NodeID=310/320'],color:'#e67e22',layer:'bc',desc:'翁福泵站+终端站，8+4种状态'},
{id:'bc_cmdic',x:820,y:385,w:120,h:45,title:'CMDIC站场',lines:['tbc_CMDIC_*','NodeID=410/420'],color:'#e67e22',layer:'bc',desc:'CMDIC泵站+终端站，含ES专家控制逻辑'},
{id:'bc_terminal',x:820,y:450,w:120,h:45,title:'终端站',lines:['tbc_*_Terminal','NodeID=150/250'],color:'#e67e22',layer:'bc',desc:'TerminalK：16种流路组合(2⁴)，质量守恒计算'},
{id:'bc_line_valve',x:820,y:515,w:120,h:45,title:'管线阀门',lines:['ibc_LineValve','阀门站'],color:'#e67e22',layer:'bc',desc:'ΔP=k·|Q|·Q，ValveStationK(4种)，PS2K(8种)'},
{id:'bc_leak',x:820,y:580,w:120,h:45,title:'泄漏模拟',lines:['ibc_LineLeak','NodeID=210'],color:'#e67e22',layer:'bc',desc:'泄漏点边界条件，模拟管道泄漏'},

// 专家控制层
{id:'leak_detect',x:970,y:60,w:120,h:50,title:'泄漏检测',lines:['LDStatusCheck','多仪表投票'],color:'#e74c3c',layer:'expert',desc:'6种场景：VS1/VS2/终端阀门变化，泵速变化(ThreseHoldSpeed+MaxSpeedChange)，系统停机/启动，多仪表投票判断泄漏，闭锁防误报'},
{id:'expert_ctrl',x:970,y:130,w:120,h:50,title:'专家控制ES',lines:['CheckPressures','CheckWhichValve'],color:'#e74c3c',layer:'expert',desc:'CheckLinePressures遍历计算点，CheckStationPressure站场压力vsSetPoint，CheckWhichValve 8种配置×开/关，累积行程最少优先，超压开阀/低压关阀'},
{id:'pid_ctrl',x:970,y:200,w:120,h:50,title:'PID控制',lines:['ControllerPosition','泵速优先级'],color:'#e74c3c',layer:'expert',desc:'离散PID：pos=V0+direction·(PB/100)·[(1+dT/Ti)·e0-e1+(Td/dT)·(e0-2e1+e2)]，PumpSpeedControllerIndex 5测点×32状态，优先级：吸入口>排出口>VS3>SF1>SF4'},
{id:'torque',x:970,y:270,w:120,h:45,title:'扭矩分析',lines:['Torque Analysis','阀门扭矩'],color:'#e74c3c',layer:'expert',desc:'TorqueValue=abs(OPCRegs[valve[ValveIndex].Torque].Value)，SampleInterval=1000ms，BufferSize=120samples(2分钟窗口)，MaxTorque/AvgTorque计算'},

// 输出/持久化层

const svg=document.getElementById('canvas');
const tooltip=document.getElementById('tooltip');

function render(){
  const W=window.innerWidth,H=window.innerHeight-50;
  svg.setAttribute('width',W);svg.setAttribute('height',H);
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.innerHTML='';
  const sx=W/1300,sy=H/680;
  const scale=Math.min(sx,sy,1.1);
  const offsetX=(W-1280*scale)/2,offsetY=(H-660*scale)/2;

  // Layer bands
  [{x:30,w:120,l:'1 数据源'},{x:180,w:130,l:'2 数据加载'},{x:340,w:130,l:'3 内存模型'},{x:500,w:130,l:'3 内存模型'},{x:660,w:130,l:'4 计算引擎'},{x:820,w:120,l:'5 边界条件'},{x:970,w:120,l:'6 专家控制'},{x:1120,w:120,l:'7 输出/界面'}].forEach(function(b){
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',offsetX+b.x*scale-8);r.setAttribute('y',offsetY+45*scale);
    r.setAttribute('width',(b.w+16)*scale);r.setAttribute('height',(H/scale-70)*scale);
    r.setAttribute('fill','#ffffff');r.setAttribute('class','layer-band');r.setAttribute('rx',6);
    svg.appendChild(r);
    var t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',offsetX+(b.x+b.w/2)*scale);t.setAttribute('y',offsetY+38*scale);
    t.setAttribute('class','layer-title');t.textContent=b.l;svg.appendChild(t);
  });

  // Edges
  var eg=document.createElementNS('http://www.w3.org/2000/svg','g');eg.id='edges';svg.appendChild(eg);
  edges.forEach(function(e,i){
    var fr=nodes.find(function(n){return n.id===e.from});
    var to=nodes.find(function(n){return n.id===e.to});
    if(!fr||!to)return;
    var x1=offsetX+(fr.x+fr.w)*scale,y1=offsetY+(fr.y+fr.h/2)*scale;
    var x2=offsetX+to.x*scale,y2=offsetY+(to.y+to.h/2)*scale;
    var dx=x2-x1,cx1=x1+dx*0.4,cx2=x2-dx*0.4;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M'+x1+','+y1+' C'+cx1+','+y1+' '+cx2+','+y2+' '+x2+','+y2);
    p.setAttribute('class','edge');p.setAttribute('stroke',e.color||'#555');
    p.setAttribute('data-idx',i);if(e.dashed)p.setAttribute('stroke-dasharray','5,3');
    eg.appendChild(p);
    // Arrow
    var ang=Math.atan2(y2-(y1+y2)/2,x2-(x1+x2)/2);
    var ar=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    var s=4;
    ar.setAttribute('points',x2+','+y2+' '+(x2-s*Math.cos(ang-0.4))+','+(y2-s*Math.sin(ang-0.4))+' '+(x2-s*Math.cos(ang+0.4))+','+(y2-s*Math.sin(ang+0.4)));
    ar.setAttribute('fill',e.color||'#555');ar.setAttribute('class','edge');ar.setAttribute('data-idx',i);ar.setAttribute('opacity','0.5');
    eg.appendChild(ar);
    if(e.label){
      var t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',(y1+y2)/2-5);
      t.setAttribute('class','edge-label');t.setAttribute('data-idx',i);
      t.textContent=e.label;eg.appendChild(t);
    }
  });

  // Nodes
  var ng=document.createElementNS('http://www.w3.org/2000/svg','g');ng.id='nodes';svg.appendChild(ng);
  nodes.forEach(function(n){
    var g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','node');g.setAttribute('data-id',n.id);g.setAttribute('data-layer',n.layer);
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',offsetX+n.x*scale);r.setAttribute('y',offsetY+n.y*scale);
    r.setAttribute('width',n.w*scale);r.setAttribute('height',n.h*scale);
    r.setAttribute('fill',n.color+'15');r.setAttribute('stroke',n.color);r.style.color=n.color;
    g.appendChild(r);
    var lines=n.lines||[n.title];
    lines.forEach(function(line,i){
      var t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',offsetX+(n.x+n.w/2)*scale);
      var totalH=lines.length*12,startY=n.y+n.h/2-totalH/2+9;
      t.setAttribute('y',offsetY+(startY+i*12)*scale);
      t.setAttribute('dominant-baseline','middle');
      if(i===0)t.setAttribute('class','node-title');
      t.textContent=line;g.appendChild(t);
    });
    g.addEventListener('mouseenter',function(ev){
      tooltip.style.display='block';
      tooltip.innerHTML='<div class="title">'+n.title+'</div><div class="desc">'+n.desc.replace(/\n/g,'<br>')+'</div>';
    });
    g.addEventListener('mousemove',function(ev){
      var tx=ev.clientX+15,ty=ev.clientY+15;
      if(tx+350>window.innerWidth)tx=ev.clientX-365;
      if(ty+200>window.innerHeight)ty=ev.clientY-200;
      tooltip.style.left=tx+'px';tooltip.style.top=ty+'px';
    });
    g.addEventListener('mouseleave',function(){tooltip.style.display='none';});
    g.addEventListener('click',function(ev){ev.stopPropagation();highlightPaths(n.id);showInfo(n);});
    ng.appendChild(g);
  });
}

function highlightPaths(nodeId){
  var connected=new Set([nodeId]),edgeIdxs=new Set();
  function fwd(id){edges.forEach(function(e,i){if(e.from===id){edgeIdxs.add(i);if(!connected.has(e.to)){connected.add(e.to);fwd(e.to);}}});}
  function bwd(id){edges.forEach(function(e,i){if(e.to===id){edgeIdxs.add(i);if(!connected.has(e.from)){connected.add(e.from);bwd(e.from);}}});}
  fwd(nodeId);bwd(nodeId);
  document.querySelectorAll('.node').forEach(function(g){
    if(connected.has(g.getAttribute('data-id'))){g.classList.add('highlight');g.classList.remove('dim');}
    else{g.classList.add('dim');g.classList.remove('highlight');}
  });
  document.querySelectorAll('#edges path,#edges polygon').forEach(function(el){
    var i=parseInt(el.getAttribute('data-idx'));
    if(edgeIdxs.has(i)){el.classList.add('highlight-edge');el.classList.remove('dim');}
    else{el.classList.add('dim');el.classList.remove('highlight-edge');}
  });
  document.querySelectorAll('#edges text').forEach(function(el){
    var i=parseInt(el.getAttribute('data-idx'));
    if(edgeIdxs.has(i))el.classList.remove('dim-label');else el.classList.add('dim-label');
  });
}

function showInfo(n){
  var p=document.getElementById('info-panel');
  p.querySelector('.ptitle').textContent=n.title;
  p.querySelector('.pcontent').innerHTML=n.desc.replace(/\n/g,'<br>');
  p.style.display='block';
}

function resetHL(){
  document.querySelectorAll('.highlight,.highlight-edge').forEach(function(el){el.classList.remove('highlight','highlight-edge');});
  document.querySelectorAll('.dim,.dim-label').forEach(function(el){el.classList.remove('dim','dim-label');});
  document.getElementById('info-panel').style.display='none';
}

svg.addEventListener('click',function(ev){
  if(ev.target===svg||(ev.target.tagName==='rect'&&ev.target.classList.contains('layer-band')))resetHL();
});

function filterLayer(type,btn){
  document.querySelectorAll('#controls button').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');resetHL();
  if(type==='all')return;
  var m={'input':['input'],'compute':['compute'],'expert':['expert'],'output':['output'],'bc':['bc'],'ui':['ui']};
  var active=m[type]||[];
  document.querySelectorAll('.node').forEach(function(g){
    if(active.indexOf(g.getAttribute('data-layer'))>=0)g.classList.remove('dim');
    else g.classList.add('dim');
  });
}

render();
window.addEventListener('resize',render);
</script>
